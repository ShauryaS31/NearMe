name: NearMe
options:
  deploymentTarget:
    iOS: "26.5"
configs:
  Debug: debug
  Release: release
targets:
  NearMe:
    type: application
    platform: iOS
    deploymentTarget: "26.5"
    sources:
      - path: NearMe
        excludes:
          - Info.plist
          - Resources/guides
      - path: NearMe/Resources/guides
        type: folder
        buildPhase: resources
      - path: Shared
    # NearMeBroadcastExtension/ is kept as source only; it is not a target yet.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.nearme.ios
        INFOPLIST_FILE: NearMe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: NearMeLiveActivity
        embed: true
  NearMeLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.5"
    sources:
      - path: NearMeLiveActivity
        excludes:
          - Info.plist
      - path: Shared/LiveActivity
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.nearme.ios.liveactivity
        INFOPLIST_FILE: NearMeLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEARME_LIVE_ACTIVITY_EXTENSION"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
  NearMeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.5"
    sources:
      - path: NearMeTests
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.nearme.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NearMe.app/NearMe"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: NearMe
schemes:
  NearMe:
    build:
      targets:
        NearMe: all
        NearMeTests: [test]
    test:
      config: Debug
      targets:
        - NearMeTests
    run:
      config: Debug
    archive:
      config: Release
