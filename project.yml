name: NearMe
options:
  deploymentTarget:
    macOS: "26.0"
configs:
  Debug: debug
  Release: release
packages:
  NearMeCore:
    path: NearMeCore
targets:
  NearMe:
    type: application
    platform: macOS
    sources:
      - path: NearMe
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.nearme.app
        INFOPLIST_FILE: NearMe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: NearMeCore
  NearMeiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.5"
    sources:
      - path: NearMeiOS/NearMeiOS
        excludes:
          - Info.plist
      - path: NearMeiOS/Shared
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.nearme.ios
        INFOPLIST_FILE: NearMeiOS/NearMeiOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  NearMeiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.5"
    sources:
      - path: NearMeiOS/NearMeiOSTests
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.nearme.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NearMeiOS.app/NearMeiOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: NearMeiOS
schemes:
  NearMe:
    build:
      targets:
        NearMe: all
    run:
      config: Debug
    archive:
      config: Release
  NearMeiOS:
    build:
      targets:
        NearMeiOS: all
        NearMeiOSTests: [test]
    test:
      config: Debug
      targets:
        - NearMeiOSTests
    run:
      config: Debug
